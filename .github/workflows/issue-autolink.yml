name: "Issue Autolink"
on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  issue-links:
    runs-on: ubuntu-latest
    steps:
      - uses: tkt-actions/add-issue-links@v1.8.2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          branch-prefix: "issue-"
          resolve: "true"
